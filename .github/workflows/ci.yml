name: SiteScope CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: sitescope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://sitescope:testpassword@localhost:5432/sitescope
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  integration:
    name: Real Docker audit and PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure isolated test stack
        run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Build and start all services
        run: docker compose up -d --build
      - name: Wait for API and web
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:4000/api/v1/health/ready && curl --fail --silent --output /dev/null http://localhost:3000; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm ci
      - run: npm run db:generate && npm run build -w @sitescope/core
      - name: Verify isolated Chromium sandbox and PDF startup
        run: docker compose exec -T -e SMOKE_OUTPUT_DIR=/tmp/sitescope-preflight browser node apps/browser/dist/smoke.js
      - name: Real registration, email, isolation, quotas, Lighthouse, PNG and PDF
        run: npm run test:integration
        env:
          INTEGRATION_TESTS: 1
      - name: Service diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=120
      - name: Stop test stack
        if: always()
        run: docker compose down
