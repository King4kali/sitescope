name: sitescope
x-app: &app
  image: sitescope-app:local
  build:
    context: .
    dockerfile: infra/Dockerfile
  env_file: .env
  init: true
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-sitescope}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sitescope}?schema=public
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://storage:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sitescope}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    NODE_ENV: development
    BROWSER_RUNNER_URL: http://browser:4100
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sitescope}
    volumes: ['pgdata:/var/lib/postgresql/data']
    ports: ['127.0.0.1:5432:5432']
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: ['redisdata:/data']
    ports: ['127.0.0.1:6379:6379']
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  storage:
    image: rustfs/rustfs:1.0.3
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-sitescope}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes: ['objects:/data']
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    networks: [data]
    restart: unless-stopped
  storage-init:
    <<: *app
    command: [node, --import, tsx, infra/init-storage.ts]
    restart: 'no'
    depends_on: [storage]
    networks: [data]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
    networks: [data]
    restart: unless-stopped
  migrate:
    <<: *app
    command: [npm, run, db:migrate]
    restart: 'no'
    networks: [data]
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *app
    ports: ['127.0.0.1:4000:4000']
    networks: [data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
  worker:
    <<: *app
    command: [node, apps/worker/dist/main.js]
    networks: [data, browser-control, outbound]
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      api: { condition: service_started }
      browser: { condition: service_started }
  browser:
    build:
      context: .
      dockerfile: infra/browser.Dockerfile
    environment:
      PORT: 4100
      PROXY_URL: http://egress:8080
      NODE_ENV: production
    networks: [browser-control, browser-egress]
    init: true
    read_only: true
    tmpfs: ['/tmp:size=512m,mode=1777', '/home/pwuser:size=32m,uid=1000,gid=1000']
    shm_size: 512m
    mem_limit: 2g
    cpus: 2.0
    cap_drop: [ALL]
    security_opt: ['seccomp=./infra/chromium-seccomp.json']
    restart: unless-stopped
  egress:
    <<: *app
    # Intentionally no env_file or app secrets in the proxy service.
    env_file: []
    environment: { NODE_ENV: production }
    command: [node, --import, tsx, infra/egress-proxy.ts]
    networks: [browser-egress, outbound]
    mem_limit: 256m
    cpus: 0.5
  web:
    <<: *app
    env_file: []
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      PORT: 3000
    command: [npm, run, start, -w, '@sitescope/web']
    ports: ['127.0.0.1:3000:3000']
    networks: [data]
    depends_on: [api]
networks:
  data:
  browser-control:
    internal: true
  browser-egress:
    internal: true
  outbound:
volumes:
  pgdata:
  redisdata:
  objects:
